name: Refresh What to Watch Today
# Fills the next trading day's economic-calendar sidebar from official
# sources only (BEA ICS feed, Fed/NYSE published calendars, fixed weekly
# releases). No AI. 7 PM ET Sun-Thu (23:00 UTC during EDT; 6 PM ET once EST
# returns - GitHub cron is UTC-only) so today's results stay up through the
# afternoon and the box rolls to the next trading day in the evening.
on:
  schedule:
    - cron: '0 23 * * 0-4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-publish-main
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh watch-today.json
        run: python3 scripts/refresh_watch_today.py | tee /tmp/out.txt
      - name: Commit if changed
        run: |
          if git diff --quiet -- site/assets/watch-today.json site/index.html; then
            echo "no changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/assets/watch-today.json site/index.html
          git commit -m "$(grep '^COMMIT_MSG=' /tmp/out.txt | cut -d= -f2- || echo 'Refresh What to Watch Today')"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && break
            test "$attempt" -lt 3 || exit 1
            sleep $((attempt * 5))
          done
      - name: Deploy committed snapshot to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: "4.136.1"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
