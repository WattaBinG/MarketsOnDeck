name: Refresh crypto ticker
# Autonomous replacement for the old local Claude routine's crypto leg.
# Deterministic: Coinbase Exchange public market data only (see AUTOMATION.md).
on:
  workflow_dispatch:
    inputs:
      cycle:
        description: "UTC 15-minute cycle dispatched by Cloudflare"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: refresh-publish-main
  cancel-in-progress: false
  queue: max

jobs:
  check_pause:
    runs-on: ubuntu-latest
    outputs:
      paused: ${{ steps.check.outputs.paused }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          python3 -c "
          import json
          flags = json.load(open('automation/pause-flags.json'))
          print('paused=' + str(bool(flags.get('crypto', False))).lower())
          " >> "$GITHUB_OUTPUT"

  refresh:
    needs: check_pause
    if: needs.check_pause.outputs.paused != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh crypto.json
        run: python3 scripts/refresh_crypto.py | tee /tmp/out.txt
      - name: Commit if changed
        run: |
          if git diff --quiet -- site/assets/crypto.json; then
            echo "no changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/assets/crypto.json
          git commit -m "$(grep '^COMMIT_MSG=' /tmp/out.txt | cut -d= -f2- || echo 'Refresh crypto ticker')"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && break
            test "$attempt" -lt 3 || exit 1
            sleep $((attempt * 5))
          done
      - name: Deploy committed snapshot to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Retry wrapper: two workflows deploy the same Worker on the same
          # 15-min tick; a simultaneous deploy or API flake fails the step.
          # Same 3-attempt pattern as the "Commit if changed" step above.
          for attempt in 1 2 3; do
            npx -y wrangler@4.136.1 deploy && break
            test "$attempt" -lt 3 || exit 1
            sleep $((attempt * 30))
          done
