name: Refresh The Wire
# Autonomous replacement for the old local Claude routine's Wire leg.
# Aggregates publishers' own RSS headlines with source attribution and
# outbound links only — no article text, no AI-written prose (AUTOMATION.md).
on:
  workflow_dispatch:
    inputs:
      cycle:
        description: "UTC 15-minute cycle dispatched by Cloudflare"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: refresh-publish-main
  cancel-in-progress: false
  queue: max

jobs:
  check_pause:
    runs-on: ubuntu-latest
    outputs:
      paused: ${{ steps.check.outputs.paused }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          python3 -c "
          import json
          flags = json.load(open('automation/pause-flags.json'))
          print('paused=' + str(bool(flags.get('wire', False))).lower())
          " >> "$GITHUB_OUTPUT"

  refresh:
    needs: check_pause
    if: needs.check_pause.outputs.paused != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install feedparser pypdf
      - name: Publish fresh data with cycle dedupe
        id: publish
        env:
          REFRESH_CYCLE: ${{ inputs.cycle }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_NEWS_CHANNEL_ID: ${{ vars.DISCORD_NEWS_CHANNEL_ID }}
        run: python3 scripts/publish_refresh.py --task wire --cycle "$REFRESH_CYCLE"
      - name: Deploy committed snapshot to Cloudflare
        if: steps.publish.outputs.published == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Retry wrapper: two workflows deploy the same Worker on the same
          # 15-min tick; a simultaneous deploy or API flake fails the step.
          # Same 3-attempt pattern as the "Commit if changed" step above.
          for attempt in 1 2 3; do
            npx -y wrangler@4.136.1 deploy && break
            test "$attempt" -lt 3 || exit 1
            sleep $((attempt * 30))
          done
