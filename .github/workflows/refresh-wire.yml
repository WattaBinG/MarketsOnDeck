name: Refresh The Wire
# Autonomous replacement for the old local Claude routine's Wire leg.
# Aggregates publishers' own RSS headlines with source attribution and
# outbound links only — no article text, no AI-written prose (AUTOMATION.md).
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-publish-main
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install feedparser
      - name: Refresh wire
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_NEWS_CHANNEL_ID: ${{ vars.DISCORD_NEWS_CHANNEL_ID }}
        run: python3 scripts/refresh_wire.py | tee /tmp/out.txt
      - name: Reshape ticker strip
        run: python3 scripts/build_ticker.py
      - name: Rank AI tools strip
        run: python3 scripts/build_ai_strip.py
      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- site/assets/wire.json site/assets/wire-archive.json site/index.html data/wire-state.json site/assets/ticker.json site/assets/ai-tools.json)" ]; then
            echo "no changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/assets/wire.json site/assets/wire-archive.json site/index.html data/wire-state.json site/assets/ticker.json site/assets/ai-tools.json
          git commit -m "$(grep '^COMMIT_MSG=' /tmp/out.txt | cut -d= -f2- || echo 'Refresh The Wire')"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && break
            test "$attempt" -lt 3 || exit 1
            sleep $((attempt * 5))
          done
      - name: Deploy committed snapshot to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: "4.136.1"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
